[mypy]
# Default: permissive. We don't want to block ANY PR on type errors in
# legacy code; the strict policy only applies to files explicitly opted in.
python_version = 3.11
warn_unused_configs = true

# Many of our deps (httpx, streamlit, websockets, etc.) don't ship stub
# files. Telling mypy to ignore missing stubs avoids false positives that
# would distract from real type errors.
ignore_missing_imports = true

# Pure modules that we actively maintain — strict mode catches refactor
# regressions before they ship. Round 65 enrolled these two:
[mypy-funding_screener.signals]
strict = true

[mypy-funding_screener.thesis]
strict = true
