name: tests

# Run pytest on every push and PR so a broken change can't quietly land.
# Page smoke tests (scripts/test_pages.py) ALSO run as a separate step so
# Streamlit import / page render errors are caught — those aren't covered
# by the unit-test suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mypy on strict-typed modules
        # Round 65 — strict on signals.py + thesis.py. Catches refactor
        # regressions in the pure-function core (composite score, auto-thesis).
        run: |
          python -m mypy src/funding_screener/signals.py src/funding_screener/thesis.py

      - name: Run unit tests
        run: |
          python -m pytest tests/ -q

      - name: Run Streamlit page smoke tests
        # AppTest verifies each page renders without raising an exception.
        # No real browser, no auto-rerun — just initial render. Catches
        # import errors, missing module references, malformed widgets.
        env:
          # Disable Binance/MEXC fetches in CI so the background daemon's
          # first iteration doesn't time out against the real APIs from
          # GitHub Actions' shared IP pool (Binance can geo-block).
          BINANCE_ENABLED: "false"
          MEXC_ENABLED: "false"
        run: |
          python scripts/test_pages.py
