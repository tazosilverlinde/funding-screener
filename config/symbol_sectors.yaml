# Sector / category mapping for tradable tokens.
#
# Used by Page 2/3/4 to add a "Sector" column and a sidebar filter so you can
# narrow the screener to one sector at a time (e.g. "show me only memes with
# high funding").
#
# Sectors are curated and approximate — many tokens straddle categories.
# When a token isn't listed here, the screener shows "—" (no sector). To add
# coverage, just append the ticker to the appropriate list below.
#
# Lookup is case-insensitive. The ticker MUST match the base asset on
# Binance/MEXC (so PEPE not 1000PEPE; the screener strips the "1000" prefix
# before lookup).

sectors:
  layer1:
    # Major Layer-1 blockchains (their L1 token)
    - BTC
    - ETH
    - SOL
    - BNB
    - XRP
    - ADA
    - AVAX
    - TRX
    - TON
    - DOT
    - NEAR
