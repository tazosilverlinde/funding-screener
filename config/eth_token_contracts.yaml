# ERC-20 contract addresses for the futures coins traded on Binance/MEXC.
# `decimals` is critical for converting raw token amounts.
#
# Coverage: limited to tokens whose primary chain is Ethereum (or that have
# a meaningful ERC-20 representation, like WBTC). Native L1 tokens (BTC, SOL,
# BNB, XRP, DOGE, ADA, AVAX, MATIC, etc.) are NOT here — they live on their
# own chains and would need separate per-chain integrations.
#
# Add a token:
#   1. Find its address on Etherscan (search the project's official site for
#      the contract, OR check coingecko.com → ethereum platform field).
#   2. Confirm decimals — most tokens are 18, but USDT/USDC are 6, WBTC is 8.
#   3. Use the symbol exactly as it appears on Binance/MEXC (e.g. "PEPE", not
#      "1000PEPE" — we strip the "1000" multiplier suffix).

ethereum:
  USDT:
    address: "0xdac17f958d2ee523a2206206994597c13d831ec7"
    decimals: 6
  USDC:
    address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"
    decimals: 6
