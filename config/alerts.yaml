# Telegram alert thresholds.
#
# Setup (one-time, ~5 min):
#   1. In Telegram, message @BotFather → /newbot → follow prompts → save the bot token.
#   2. In Telegram, message @userinfobot → save your numeric user ID (the chat_id).
#   3. Set env vars:
#        TELEGRAM_BOT_TOKEN = "1234567890:ABCDEFG..."
#        TELEGRAM_CHAT_ID   = "123456789"
#      Locally: export them before `streamlit run`.
#      Render:  Service → Environment → add both as plain env vars.
#   4. (Optional) Adjust the thresholds below. Reduce them = more alerts.
#
# State machine: each alert fires only on TRANSITION (off→on). When the condition
# clears, a "resolved" message fires. Cooldown prevents the same alert from firing
# more than once per `cooldown_minutes` even if conditions oscillate.

alerts:
  enabled: true
  cooldown_minutes: 240   # 4 hours per (alert_type, symbol) pair

  # Overlap suppression (Round 63) — when multiple alert kinds fire for the
  # SAME pair due to a single underlying regime change (e.g. score jumps
  # +50 → triggers composite + score_delta + fresh_setup simultaneously),
  # keep only the highest-priority kind. Resolved events pass through so
  # per-kind state machines stay consistent.
  # Each group is an ordered list (first = highest priority).
  overlap_suppression:
    enabled: true
    groups:
      - [fresh, composite, score_delta]
    # Alerts outside any group (liq, funding, oi_surge, whale, sector, etc.)
    # are independent — never suppressed.

  # Telegram global rate limit (Round 61) — caps outbound messages per
  # rolling 60s window across ALL alert kinds combined. Prevents the bot
  # account from being suspended during volatile periods when many alerts
  # fire simultaneously. Overflow is DROPPED (with a log warning + counter
  # on Page 12) rather than queued, because queueing makes alerts stale.
  # Telegram's hard limit to a single chat is ~30 msg/sec; default 20/min
  # is well under that with headroom for batched-digest sends.
  telegram_rate_limit_per_minute: 20

  # Watchlist filter (Round 48). When non-empty, per-symbol alerts (composite,
  # score-delta, fresh-setup, funding-deviation, OI-surge) only fire for rows
  # whose base asset is in this list. Sector-rotation and aggregate-flow
  # alerts still see the full universe so a sector turning bullish across
  # ALL its tokens still fires regardless of watchlist.
  # Empty list (default) = no filter; every pair eligible to fire.
  # Use uppercase tickers, e.g.:
  #   watchlist: [BTC, ETH, SOL, WIF, PEPE]
  watchlist: []

  # Composite score crossing extremes — biggest signal-to-noise.
  composite_score:
    enabled: true
    bullish_threshold: 70   # alert when score >= 70
    bearish_threshold: -70  # alert when score <= -70

  # Score-Δ-jump alert — fires when the 1h score change is large in either
  # direction. Catches "ARB just rallied 40 score points in an hour" before
  # the absolute score crosses the extreme threshold above.
  composite_score_delta:
    enabled: true
    abs_threshold: 25       # alert when |score Δ 1h| >= this

  # Fresh-setup alert (Round 41) — fires when a row newly enters Fresh bull
  # or Fresh bear quality (signal age < 1h, σ < 30) AND has high conviction.
  # Complements composite_score by catching setups in their first hour
  # specifically — the asymmetric-edge window before the move accumulates.
  fresh_setup:
    enabled: true
    min_abs_score: 70

  # Sector-rotation alert (Round 42) — fires when an entire sector's average
  # composite score crosses ±threshold. Catches broad rotations (e.g. "DeFi
  # sector flips bullish") that individual-token alerts can miss when the
  # move is breadth-driven rather than concentrated.
  sector_rotation:
    enabled: true
    threshold: 30          # alert when |avg_score| >= this
    min_token_count: 3     # require at least N tokens in the sector

  # Loop-stall alert (Round 55) — fires when a background loop hasn't
  # completed a cycle for `stall_multiplier × expected_interval` seconds.
  # System-health companion to memory_pressure. Per-loop state machine so
  # a stalled fast loop doesn't suppress an alert for the macro loop.
  loop_stall:
    enabled: true
    stall_multiplier: 3.0     # alert when elapsed >= this × expected interval

  # Error-pattern alert (Round 57) — catches sustained subsystem failures
  # by grouping errors by source-prefix and firing when ANY category repeats
  # `repeat_threshold` or more times within `window_minutes`. Doesn't trip
  # on transient RPC blips (single-blip errors don't accumulate).
  error_pattern:
    enabled: true
    window_minutes: 30
    repeat_threshold: 5

  # Memory-pressure alert (Round 52) — fires when process RSS crosses
  # `pct_threshold`% of `budget_mb`. Closes the loop on the 2GB hard cap:
  # operators get a Telegram heads-up before the process is at risk of
  # crashing. State-machine handles transitions so it sends ONE message
  # crossing in and ONE crossing out.
  memory_pressure:
    enabled: true
    budget_mb: 2048           # the hard cap; matches process_memory.PROCESS_MEMORY_BUDGET_MB
    pct_threshold: 75         # alert when RSS / budget * 100 >= this

    # Auto-trim (Round 54, default-on as of Round 60) — when memory pressure
    # crosses pct_threshold, the alerts loop defensively shrinks the two
    # biggest growable buffers (score history + liquidations). Default is
    # now ENABLED because the user has a hard 2GB-per-process cap that the
    # process WILL hit under busy-market load without trimming. Users who
    # prefer pristine 24h history at the cost of memory pressure can flip
    # to false.
    auto_trim:
      enabled: true
      score_history_hours: 12      # default 24h; trim to this when fired
      liq_window_seconds: 43200    # 12 hours; default 24h elsewhere

  # Alert summary digest (Round 50) — sends ONE batched Telegram message
  # every `interval_minutes` summarizing every alert that fired since the
  # previous summary, grouped by kind. Complementary to per-event firing
  # (both can be on); useful as a quieter mode when per-event is too chatty.
  # Disabled by default — opt in by flipping enabled to true.
  summary_digest:
    enabled: false
    interval_minutes: 30
    max_per_kind: 5         # cap symbols listed per kind in the summary

  # Funding-rate deviation — fires when current funding is z >= threshold
  # away from its ~30-period mean. Mean-revert candidates: extreme overshoot
  # often precedes a cooldown; extreme undershoot precedes a squeeze.
  # Tracked per direction so a flip from overshoot to undershoot re-fires.
  funding_deviation:
    enabled: true
    z_threshold: 2.5         # alert when |z-score| >= 2.5σ

  # Funding rate crossing absolute threshold (8h-normalized).
  funding_rate:
    enabled: true
    threshold_pct_8h: 2.0   # alert when |funding_8h_norm| > 2%

  # Open Interest 24h surge.
  oi_surge:
    enabled: true
    threshold_pct_24h: 50.0  # alert when |OI 24h Δ| > 50%

  # Whale flow on Page 6 — alert when net netflow exceeds threshold (USD).
  whale_flow:
    enabled: true
    threshold_usd: 20_000_000

  # Liquidation cascades + big single events. The window controls how recent
  # the data has to be — 1h ≈ "right now", 6h ≈ "this trading session".
  liquidations:
    enabled: true
    window_seconds: 3600
    cascade_threshold_usd: 50_000_000   # alert when total liq in window >= this
    single_threshold_usd: 10_000_000    # alert when one event >= this notional

  # New listing detected (any new perp contract on Binance or MEXC).
  new_listing:
    enabled: true

  # Token unlock approaching.
  token_unlock:
    enabled: true
    days_ahead: 3            # alert when an unlock is within N days
