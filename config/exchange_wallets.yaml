# Known exchange hot/cold wallets on Ethereum mainnet.
# These addresses are PUBLIC information — they appear with the exchange
# label visible to anyone on Etherscan, and in many open-source whale-tracker
# repos. Adding more wallets just makes the netflow more accurate; missing
# wallets means some legit deposits/withdrawals get missed (under-counts the
# absolute number, doesn't bias direction).
#
# Add a wallet:
#   1. Confirm the label on Etherscan (search the address; the exchange label
#      shows in the top-right of the address page if Etherscan has tagged it).
#   2. Lowercase the address.
#   3. Comment with which numbered hot wallet it is, for easy auditing.

