# Non-whale addresses — public addresses that look like whales by size but
# aren't actionable signal: DEX routers, bridges, protocol contracts, known
# market makers. We exclude these on the WHALE-FLOW page so a $50M Uniswap
# router pass-through doesn't show as "whale accumulation".
#
# These are PUBLIC addresses, all visible on Etherscan with the official
# project label. Add more as you spot them; missing entries just make the
# whale signal noisier (less accurate), not wrong.
#
# All addresses lowercase. Comments document what each is (handy when
# reviewing). The categories are just for organisation — the loader
# flattens everything to one big set.

